[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.2",
  "uvicorn[standard]>=0.24.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "bcrypt>=4.1.0",
  "pydantic>=2.5.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv]
project = "pyproject.toml"
